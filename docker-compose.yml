# mnemos — local stack (v0.1)

services:
  postgres:
    image: postgres:17-alpine
    container_name: mnemos-postgres
    environment:
      POSTGRES_USER: mnemos
      POSTGRES_PASSWORD: mnemos
      POSTGRES_DB: mnemos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemos -d mnemos"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mnemos-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  service:
    build:
      context: .
      dockerfile: packages/service/Dockerfile
    container_name: mnemos-service
    depends_on:
      postgres: { condition: service_healthy }
      qdrant:   { condition: service_healthy }
    environment:
      MNEMOS_DATABASE_URL: postgresql+psycopg://mnemos:mnemos@postgres:5432/mnemos
      MNEMOS_QDRANT_URL: http://qdrant:6333
      MNEMOS_QDRANT_COLLECTION: mnemos
      MNEMOS_EMBEDDING_MODEL: BAAI/bge-m3
      MNEMOS_EMBEDDING_DIM: "1024"
      MNEMOS_JUDGE_MODEL: claude-haiku-4-5
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - fastembed-cache:/root/.cache/fastembed

  # dashboard:  # v0.5 (Next.js read-only views)

volumes:
  postgres-data:
  qdrant-data:
  fastembed-cache:
