[project]
name = "mnemos-service"
version = "0.0.1"
description = "FastAPI HTTP service exposing mnemos-core"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Álvaro Cano" }]
dependencies = [
    "mnemos-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
