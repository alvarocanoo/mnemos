[project]
name = "mnemos-eval"
version = "0.0.1"
description = "mnemos-bench: dataset, runner, metrics, leaderboard for agent memory eval"
requires-python = ">=3.12"
dependencies = [
    "mnemos-core",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
]

[project.scripts]
mnemos-eval = "mnemos_eval.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemos_eval"]
