[project]
name = "mnemos-core"
version = "0.0.1"
description = "mnemos core library: storage, retrieval, memory ops, embeddings"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.13",
    "fastembed>=0.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemos"]
