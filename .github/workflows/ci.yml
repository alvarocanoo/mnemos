name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: lint + tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Pytest
        run: uv run pytest -q
        env:
          # Tests for the LLM judge use mocks; this empty key just ensures
          # the env var exists so anthropic.Anthropic() doesn't error on
          # client construction even when no real call is made.
          ANTHROPIC_API_KEY: "sk-test-mocked-not-real"

  dashboard-build:
    name: dashboard build (next ${{ matrix.next-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        next-version: ["16"]
    defaults:
      run:
        working-directory: packages/dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/dashboard/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
